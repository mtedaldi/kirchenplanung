[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "kirchenplanung"
version = "0.1.0"
description = "Kirchliches Planungs- und Reservationssystem"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Templating + Frontend
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",   # Formular-Parsing

    # Datenbank
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Authentifizierung
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",

    # Passwort-Stärke
    "zxcvbn>=4.4.28",

    # Validierung
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP-Client (für interne Tests)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
