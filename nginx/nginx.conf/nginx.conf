events {
    worker_connections 1024;
}

http {
    # Rate-Limiting Zonen
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=60r/m;

    server {
        listen 80;
        server_name localhost;

        # Security-Header
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Statische Dateien direkt ausliefern
        location /static/ {
            alias /app/static/;
            expires 1d;
        }

        # Login: Rate-Limiting 5/min
        location /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Öffentlicher Kalender: 60/min
        location /api/v1/calendar/public {
            limit_req zone=public burst=10 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Alles andere: 300/min
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
