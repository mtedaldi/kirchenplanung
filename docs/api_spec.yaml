components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OccurrenceId:
      name: occurrence_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 25
        maximum: 50
  responses:
    Unauthorized:
      description: Nicht eingeloggt oder Token abgelaufen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Keine Berechtigung für diese Aktion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Ungültige Eingabe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Conflict:
      description: Konflikt (z.B. Raum bereits belegt)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictDetail'
    TooManyRequests:
      description: Rate-Limit überschritten (Login-Endpunkt)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EventStatus:
      type: string
      enum:
      - requested
      - approved
      - confirmed
      - rejected
      - cancelled
    LocationType:
      type: string
      enum:
      - building
      - room
      - outdoor
      - other
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        person:
          $ref: '#/components/schemas/PersonMinimal'
        last_login_at:
          type: string
          format: date-time
          nullable: true
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
    EventCreateRequest:
      type: object
      required:
      - title
      - occurrences
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        is_public:
          type: boolean
          default: false
        occurrences:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OccurrenceCreateRequest'
    EventUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        is_public:
          type: boolean
    EventDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/EventStatus'
        is_public:
          type: boolean
        created_by:
          $ref: '#/components/schemas/PersonMinimal'
        approved_by:
          $ref: '#/components/schemas/PersonMinimal'
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/OccurrenceDetail'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventDetail'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    ApproveRequest:
      type: object
      properties:
        conflict_reason:
          type: string
          description: Verpflichtend wenn has_conflict = true
          nullable: true
    RejectRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 5
    OccurrenceCreateRequest:
      type: object
      required:
      - start_time
      - end_time
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        location_ids:
          type: array
          items:
            type: string
            format: uuid
        resource_requests:
