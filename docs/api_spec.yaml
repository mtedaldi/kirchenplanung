openapi: 3.1.0
info:
  title: Kirchliches Planungs- und Reservationssystem
  version: 0.2.1
  description: 'API für das kirchliche Planungs- und Reservationssystem.


    ## Authentifizierung

    Alle Endpunkte ausser `/auth/login` und `/kalender/public` erfordern einen

    gültigen JWT im HttpOnly-Cookie (`access_token`).


    ## Rollen

    - **requester** — Kann Anlässe erstellen und eigene bearbeiten

    - **approver** — Kann Anlässe freigeben/ablehnen

    - **admin** — Vollzugriff, Benutzerverwaltung, Sperrzeiten


    ## Workflow

    ```

    requested → approved → confirmed

    requested → rejected → requested (nach Überarbeitung)

    any → cancelled (Endzustand)

    ```


    ## Hinweise

    - Zeitstempel immer in UTC (ISO 8601: `2026-05-09T14:00:00Z`)

    - UUID v4 als Primärschlüssel

    - Self-Approval ist technisch unterbunden (HTTP 403)

    '
  contact:
    name: Marco Tedaldi
    url: https://github.com/mtedaldi/kirchenplanung
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-security-conventions:
    rbac: Jeder Endpunkt mit x-required-roles MUSS via FastAPI Depends(require_role(...))
      gesichert sein
    ownership: Endpunkte mit x-ownership-check MUSS via Depends(require_owner_or_admin(...))
      gesichert sein
    rate_limiting:
      /auth/login: 5 req/min pro IP (nginx)
      /calendar/public: 60 req/min pro IP (nginx)
      default: 300 req/min pro IP (nginx)
    jwt: HttpOnly-Cookie, kein Authorization-Header
    password_strength: zxcvbn Score >= 3 verpflichtend bei Erstellung und Änderung
    network:
      nginx: Only container with public ports (80, 443)
      app: No public ports — internal Docker network only
      db: 'No public ports — internal: true Docker network, no internet access'
      ufw: 'Host firewall: only ports 22, 80, 443 open'
      fail2ban: Monitors nginx logs, bans IPs after repeated login failures
      ssh: Password auth disabled, root login disabled, key-only
servers:
- url: https://kirchenplanung.example.ch/api/v1
  description: Produktion (Infomaniak VPS)
- url: http://localhost:8000/api/v1
  description: Lokale Entwicklung
tags:
- name: auth
  description: Authentifizierung und Session-Management
- name: events
  description: Anlässe (zentrales Objekt)
- name: occurrences
  description: Konkrete Termine eines Anlasses
- name: locations
  description: Räume und Gebäude
- name: resources
  description: Begrenzte Ressourcen (Mikrofone, Stühle etc.)
- name: persons
  description: Personenstammdaten
- name: users
  description: Benutzerverwaltung (Admin)
- name: duty
  description: Dienstplan-Journal
- name: blackouts
  description: Sperrzeiten (Admin)
- name: calendar
  description: Kalenderansichten
- name: admin
  description: Administrative Funktionen (Archivierung, DSG)
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Einloggen
      description: Gibt JWT als HttpOnly-Cookie zurück.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login erfolgreich
          headers:
            Set-Cookie:
              description: HttpOnly-Cookie mit access_token und refresh_token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Ausloggen
      description: Löscht JWT-Cookies serverseitig.
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Logout erfolgreich
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-note-auth: any authenticated user
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Access-Token erneuern
      description: Verwendet Refresh-Token-Cookie um neuen Access-Token zu erhalten.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Token erneuert
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-note-auth: any authenticated user
  /auth/me:
    get:
      tags:
      - auth
      summary: Aktuell eingeloggter Benutzer
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Benutzerprofil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-note-auth: any authenticated user
  /auth/me/password:
    put:
      tags:
      - auth
      summary: Eigenes Passwort ändern
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Passwort geändert
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-note-auth: any authenticated user
  /events:
    get:
      tags:
      - events
      summary: Anlässe auflisten
      description: 'Gibt Anlässe zurück abhängig von der Rolle des aufrufenden Benutzers:

        - **requester**: nur eigene Anlässe

        - **approver/admin**: alle Anlässe

        '
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/EventStatus'
      - name: from
        in: query
        description: Startdatum (ISO 8601)
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Enddatum (ISO 8601)
        schema:
          type: string
          format: date
      - name: location_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Liste von Anlässen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-roles:
      - requester
      - approver
      - admin
    post:
      tags:
      - events
      summary: Neuen Anlass erstellen
      description: Erstellt Anlass mit Status `requested`. Erfordert Rolle `requester`
        oder höher.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Anlass erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-roles:
      - requester
      - approver
      - admin
  /events/{event_id}:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      tags:
      - events
      summary: Anlass abrufen
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: Anlassdetail
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
    patch:
      tags:
      - events
      summary: Anlass bearbeiten
      description: 'Nur durch Ersteller (status `requested` oder `rejected`) oder
        Admin.

        Genehmigte Anlässe können nicht mehr bearbeitet werden.

        '
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Anlass aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-roles:
      - requester
      - approver
      - admin
      x-ownership-check: event.created_by == current_user OR admin
    delete:
      tags:
      - events
      summary: Anlass abbrechen (cancel)
      description: 'Setzt Status auf `cancelled` (Soft Delete, kein physisches Löschen).

        Nur Ersteller oder Admin.

        '
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Anlass abgebrochen
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
      x-ownership-check: event.created_by == current_user OR admin
  /events/{event_id}/approve:
    post:
      tags:
      - events
      summary: Anlass freigeben
      description: 'Setzt Status auf `approved` → `confirmed`.

        Erfordert Rolle `approver` oder `admin`.

        Self-Approval wird mit HTTP 403 abgelehnt.

        Bei aktiven Konflikten muss `conflict_reason` mitgeliefert werden.

        '
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Anlass freigegeben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '403':
          description: Keine Berechtigung oder Self-Approval-Versuch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Konflikt vorhanden aber kein conflict_reason geliefert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictDetail'
      x-required-roles:
      - approver
      - admin
  /events/{event_id}/reject:
    post:
      tags:
      - events
      summary: Anlass ablehnen
      description: 'Setzt Status auf `rejected`. Erfordert Rolle `approver` oder `admin`.

        `reason` ist verpflichtend.

        '
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Anlass abgelehnt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - approver
      - admin
  /events/{event_id}/resubmit:
    post:
      tags:
      - events
      summary: Abgelehnten Anlass neu einreichen
      description: 'Setzt Status von `rejected` zurück auf `requested`.

        Nur durch den ursprünglichen Ersteller.

        '
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Anlass neu eingereicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      x-ownership-check: event.created_by == current_user
  /events/{event_id}/audit:
    get:
      tags:
      - events
      summary: Audit Log eines Anlasses
      description: 'Erfordert Rolle approver oder admin.

        Approver: gefilterte Ausgabe — kein old_value/new_value für Personendaten.

        Admin: vollständiger Audit-Trail.'
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Audit-Einträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - approver
      - admin
      x-audit-filter: approver receives redacted person fields
  /events/{event_id}/occurrences:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      tags:
      - occurrences
      summary: Termine eines Anlasses auflisten
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Liste von Terminen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
    post:
      tags:
      - occurrences
      summary: Neuen Termin hinzufügen
      description: 'Führt Konfliktprüfung durch. Bei Konflikt wird `has_conflict =
        true`

        gesetzt, aber der Termin wird trotzdem erstellt (nicht blockiert).

        '
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceCreateRequest'
      responses:
        '201':
          description: Termin erstellt (ggf. mit Konflikt-Flag)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-required-roles:
      - requester
      - approver
      - admin
  /events/{event_id}/occurrences/{occurrence_id}:
    parameters:
    - $ref: '#/components/parameters/EventId'
    - $ref: '#/components/parameters/OccurrenceId'
    patch:
      tags:
      - occurrences
      summary: Termin bearbeiten
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceUpdateRequest'
      responses:
        '200':
          description: Termin aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
    delete:
      tags:
      - occurrences
      summary: Einzelnen Termin absagen
      description: Setzt `is_cancelled = true` auf dem Termin (nicht der gesamte Anlass).
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Termin abgesagt
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
  /events/{event_id}/occurrences/{occurrence_id}/conflicts:
    get:
      tags:
      - occurrences
      summary: Konflikte eines Termins abrufen
      description: Gibt alle kollidierenden Termine zurück.
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/OccurrenceId'
      responses:
        '200':
          description: Konflikteliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConflictDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
  /events/{event_id}/occurrences/{occurrence_id}/participants:
    parameters:
    - $ref: '#/components/parameters/EventId'
    - $ref: '#/components/parameters/OccurrenceId'
    get:
      tags:
      - occurrences
      summary: Teilnehmer eines Termins auflisten
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Teilnehmerliste (Snapshots)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipantSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
    post:
      tags:
      - occurrences
      summary: Teilnehmer hinzufügen
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantAddRequest'
      responses:
        '201':
          description: Teilnehmer hinzugefügt (Snapshot erstellt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
  /locations:
    get:
      tags:
      - locations
      summary: Räume und Gebäude auflisten
      security:
      - cookieAuth: []
      parameters:
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/LocationType'
      - name: active_only
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Liste aller Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
      x-required-roles:
      - requester
      - approver
      - admin
    post:
      tags:
      - locations
      summary: Neuen Raum/Gebäude erstellen
      description: Erfordert Rolle `admin`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreateRequest'
      responses:
        '201':
          description: Location erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - admin
  /locations/{location_id}/availability:
    get:
      tags:
      - locations
      summary: Verfügbarkeit eines Raumes prüfen
      description: Gibt belegte Zeiträume im angegebenen Fenster zurück.
      security:
      - cookieAuth: []
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Belegte Zeiträume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccupiedSlot'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - requester
      - approver
      - admin
  /resources:
    get:
      tags:
      - resources
      summary: Ressourcen auflisten
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Liste aller Ressourcen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
      x-required-roles:
      - requester
      - approver
      - admin
    post:
      tags:
      - resources
      summary: Neue Ressource erstellen
      description: Erfordert Rolle `admin`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: Ressource erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - admin
  /persons:
    get:
      tags:
      - persons
      summary: Personen auflisten
      description: 'Erfordert Rolle approver oder admin.

        Approver: max. 10 Ergebnisse, nur via Suchbegriff (q verpflichtend).

        Admin: vollständige Liste bis max. 50 Ergebnisse.

        Pagination verpflichtend.'
      security:
      - cookieAuth: []
      parameters:
      - name: q
        in: query
        description: Suchbegriff (Name, E-Mail)
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Personenliste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - approver
      - admin
    post:
      tags:
      - persons
      summary: Neue Person erfassen
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreateRequest'
      responses:
        '201':
          description: Person erfasst
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-roles:
      - approver
      - admin
  /persons/{person_id}:
    parameters:
    - name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - persons
      summary: Person abrufen
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Personendetail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - approver
      - admin
    patch:
      tags:
      - persons
      summary: Person bearbeiten
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdateRequest'
      responses:
        '200':
          description: Person aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - approver
      - admin
  /persons/{person_id}/anonymize:
    post:
      tags:
      - persons
      summary: Person anonymisieren (DSG Recht auf Vergessenwerden)
      description: 'Erfordert Rolle `admin`.

        Anonymisiert Stammdaten und alle Snapshots irreversibel.

        Wird im Audit Log protokolliert.

        '
      security:
      - cookieAuth: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Person anonymisiert
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-required-roles:
      - admin
  /users:
    get:
      tags:
      - users
      summary: Benutzer auflisten
      description: Erfordert Rolle `admin`.
